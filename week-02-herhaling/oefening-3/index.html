<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 2 — Oefening 3: Pizza-party planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pizza-party planner</h1>
  </header>
  <main>
    <section class="form">
      <h2>Plan je feestje</h2>
      <form id="pizza-form">
        <input type="number" id="guests" placeholder="Aantal gasten">
        <input type="number" id="price" placeholder="Prijs per pizza (€)" step="0.01">
        <button type="submit">Bereken</button>
      </form>
    </section>
    <section>
      <h2>Resultaat</h2>
      <p id="result"></p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
