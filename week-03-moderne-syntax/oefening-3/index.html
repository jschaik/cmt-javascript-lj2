<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Week 3 — Oefening 3: Playlist-bouwer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Playlist-bouwer</h1>
  </header>
  <main>
    <section class="form">
      <h2>Nummer toevoegen</h2>
      <form id="song-form">
        <input type="text" id="title" placeholder="Titel">
        <input type="text" id="artist" placeholder="Artiest">
        <button type="submit">Voeg toe</button>
      </form>
    </section>
    <section>
      <h2>Mijn playlist</h2>
      <p id="counter">Je playlist heeft 0 nummers</p>
      <div id="playlist"></div>
      <button id="clear-btn">Wis playlist</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
